name: Deploy migrated VidhAI portfolio

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-vidhai-portfolio.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout VidhAI-Public
        uses: actions/checkout@v4

      - name: Checkout VidhAI source
        uses: actions/checkout@v4
        with:
          repository: VISHNUVS-1315/VidhAI
          ref: main
          path: source

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: source/portfolio/package-lock.json

      - name: Build portfolio
        working-directory: source/portfolio
        env:
          NEXT_PUBLIC_BASE_PATH: /VidhAI-Public
          NEXT_PUBLIC_SITE_URL: https://vishnuvs-1315.github.io/VidhAI-Public/
        run: |
          npm ci
          npm run build

      - name: Stage generated site
        run: |
          rm -rf "$RUNNER_TEMP/vidhai-site"
          mkdir -p "$RUNNER_TEMP/vidhai-site"
          cp -a source/portfolio/out/. "$RUNNER_TEMP/vidhai-site/"

      - name: Replace portfolio website while preserving APK releases
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='README.md' \
            --exclude='releases/' \
            "$RUNNER_TEMP/vidhai-site/" ./
          touch .nojekyll

      - name: Commit generated portfolio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Generated portfolio is already current."
            exit 0
          fi
          git commit -m "web: deploy migrated VidhAI portfolio [skip ci]"
          git push
